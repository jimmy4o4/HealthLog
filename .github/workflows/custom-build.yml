name: Custom build (fork)

# Fork-only image build: linux/amd64, pushed to ghcr.io/<owner>/healthlog.
# Tag this branch with `<version>-poll.N` (e.g. 1.43.2-poll.1) or run the
# workflow manually and give the image tag. The upstream release pipeline
# (docker-publish.yml) is deliberately left untouched.

on:
  push:
    tags: ["*-poll.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag, e.g. 1.43.2-poll.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and image name
        id: meta
        run: |
          tag="${{ github.event.inputs.image_tag || github.ref_name }}"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/healthlog" >> "$GITHUB_OUTPUT"
          # Optional GeoLite2 databases: the Dockerfile COPYs this directory.
          mkdir -p assets/geolite2
          touch assets/geolite2/.empty

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.tag }}
            NEXT_PUBLIC_APP_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
